<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .brand-grad { background: linear-gradient(135deg, #f58529 0%, #dd2a7b 50%, #8134af 100%); }
    .brand-text { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-lg">
        <span class="brand-grad w-8 h-8 rounded-lg grid place-items-center text-white text-sm">AJ</span>
        {{ settings.APP_NAME }}
      </a>
      <nav class="flex items-center gap-1 text-sm">
        {% if user %}
          <a href="/dashboard" class="px-3 py-2 rounded-lg hover:bg-slate-100">Panel</a>
          <a href="/logs" class="px-3 py-2 rounded-lg hover:bg-slate-100">Tarix</a>
          <span class="hidden sm:inline px-3 text-slate-400">{{ user.email }}</span>
          <a href="/logout" class="px-3 py-2 rounded-lg hover:bg-slate-100 text-slate-500">Chiqish</a>
        {% else %}
          <a href="/login" class="px-3 py-2 rounded-lg hover:bg-slate-100">Kirish</a>
          <a href="/register" class="px-4 py-2 rounded-lg brand-grad text-white font-medium">Boshlash</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
    {% for f in flashes %}
      <div class="mb-4 rounded-xl px-4 py-3 text-sm {{ 'bg-red-50 text-red-700 border border-red-200' if f.kind == 'error' else 'bg-emerald-50 text-emerald-700 border border-emerald-200' }}">
        {{ f.message }}
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500 flex flex-wrap gap-4 justify-between">
      <span>© {{ settings.APP_NAME }}</span>
      <span class="flex gap-4">
        <a href="/privacy" class="hover:text-slate-800">Maxfiylik siyosati</a>
        <a href="/terms" class="hover:text-slate-800">Foydalanish shartlari</a>
        <a href="/data-deletion" class="hover:text-slate-800">Ma'lumotlarni o'chirish</a>
      </span>
    </div>
  </footer>
</body>
</html>
